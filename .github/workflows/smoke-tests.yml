name: TripRadar smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build API container
        run: docker build -t tripradar-api:test .
      - name: Run smoke regression tests
        run: npm test
